[theme]
base = "light"
primaryColor = "#c65076"
backgroundColor = "#fff8ef"
secondaryBackgroundColor = "#fff0e5"
textColor = "#543f50"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = false

[server]
headless = true
enableStaticServing = true
maxUploadSize = 10
# Keep mobile session state and selected uploads available through a temporary
# network drop while the native photo picker is open.
websocketPingInterval = 30
disconnectedSessionTTL = 300
