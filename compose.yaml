services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      PORT: "8501"
      DATABASE_URL: "postgresql+psycopg://brain_racer:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/brain_racer"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: brain_racer
      POSTGRES_USER: brain_racer
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain_racer -d brain_racer"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
