name: Verify Brain Racer
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: node --test tests/frontend.test.cjs
      - run: python -m compileall -q app.py brain_racer scripts
      - run: node --check assets/game.js && node --check assets/ui.js
